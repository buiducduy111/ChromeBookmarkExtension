<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../libs/fontawesome-css/all.min.css">
  <link rel="stylesheet" href="../shared/common.css">
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <!-- Header -->
  <div class="sp-header">
    <h1><i class="fa-solid fa-bookmark"></i> Bookmarks</h1>
    <div class="header-actions">
      <button id="btnImport" class="btn-secondary" title="Import from Chrome">
        <i class="fa-solid fa-file-import"></i> Import
      </button>
    </div>
  </div>

  <!-- Search -->
  <div class="sp-search">
    <i class="fa-solid fa-search search-icon"></i>
    <input type="text" id="searchInput" placeholder="Search bookmarks...">
  </div>

  <!-- Main Content -->
  <div class="sp-content">
    <!-- Sidebar: Categories -->
    <div class="sp-sidebar">
      <div class="sidebar-header">
        <span>Categories</span>
        <button id="btnAddCategory" class="btn-icon" title="Add category">
          <i class="fa-solid fa-plus"></i>
        </button>
      </div>
      <div id="categoryList" class="category-list"></div>
    </div>

    <!-- Main: Bookmarks -->
    <div class="sp-main">
      <div id="mainHeader" class="main-header hidden">
        <div class="main-title">
          <i id="activeCatIcon" class=""></i>
          <span id="activeCatName"></span>
          <span id="activeCatCount" class="count-badge"></span>
        </div>
        <div class="main-actions">
          <button id="btnEditCategory" class="btn-icon" title="Edit category">
            <i class="fa-solid fa-pen"></i>
          </button>
          <button id="btnDeleteCategory" class="btn-icon" title="Delete category">
            <i class="fa-solid fa-trash"></i>
          </button>
          <button id="btnAddBookmark" class="btn-primary btn-sm">
            <i class="fa-solid fa-plus"></i> Add
          </button>
        </div>
      </div>
      <div id="bookmarkList" class="bookmark-list">
        <div class="empty-state">
          <i class="fa-solid fa-arrow-left"></i>
          Select a category on the left to view bookmarks
        </div>
      </div>
      <div id="searchResults" class="bookmark-list hidden"></div>
    </div>
  </div>

  <!-- Category Modal -->
  <div id="categoryModal" class="modal-overlay hidden">
    <div class="modal">
      <h3 id="categoryModalTitle">Add Category</h3>
      <div class="form-group">
        <label>Category name</label>
        <input type="text" id="catName" placeholder="Enter category name...">
      </div>
      <div class="form-group">
        <label>Choose icon</label>
        <div class="icon-picker-search">
          <input type="text" id="iconSearch" placeholder="Search icons...">
        </div>
        <div id="iconPicker" class="icon-picker"></div>
      </div>
      <div class="selected-icon-preview">
        <span>Selected icon:</span>
        <i id="selectedIconPreview" class="fa-solid fa-folder"></i>
      </div>
      <input type="hidden" id="selectedIcon" value="fa-solid fa-folder">
      <input type="hidden" id="editCategoryId" value="">
      <div class="modal-actions">
        <button id="btnCancelCategory" class="btn-secondary">Cancel</button>
        <button id="btnSaveCategory" class="btn-primary">Save</button>
      </div>
    </div>
  </div>

  <!-- Bookmark Modal -->
  <div id="bookmarkModal" class="modal-overlay hidden">
    <div class="modal">
      <h3 id="bookmarkModalTitle">Add Bookmark</h3>
      <div class="form-group">
        <label>Title</label>
        <input type="text" id="bmTitle" placeholder="Enter title...">
      </div>
      <div class="form-group">
        <label>URL</label>
        <input type="url" id="bmUrl" placeholder="https://example.com">
      </div>
      <div class="form-group">
        <label>Category</label>
        <select id="bmCategory"></select>
      </div>
      <input type="hidden" id="editBookmarkId" value="">
      <div class="modal-actions">
        <button id="btnCancelBookmark" class="btn-secondary">Cancel</button>
        <button id="btnSaveBookmark" class="btn-primary">Save</button>
      </div>
    </div>
  </div>

  <!-- Confirm Modal -->
  <div id="confirmModal" class="modal-overlay hidden">
    <div class="modal">
      <h3>Confirm</h3>
      <p id="confirmMessage"></p>
      <div class="modal-actions">
        <button id="btnCancelConfirm" class="btn-secondary">Cancel</button>
        <button id="btnConfirm" class="btn-danger">Delete</button>
      </div>
    </div>
  </div>

  <!-- Import Progress -->
  <div id="importModal" class="modal-overlay hidden">
    <div class="modal">
      <h3><i class="fa-solid fa-file-import"></i> Import Bookmarks</h3>
      <p id="importStatus">Importing bookmarks from Chrome...</p>
      <div id="importProgress" class="import-progress">
        <div class="progress-bar"><div id="progressFill" class="progress-fill"></div></div>
      </div>
      <div class="modal-actions">
        <button id="btnCloseImport" class="btn-primary hidden">Close</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast hidden"></div>

  <script type="module" src="sidepanel.js"></script>
</body>
</html>
