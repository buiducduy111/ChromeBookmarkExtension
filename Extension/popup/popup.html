<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../libs/fontawesome-css/all.min.css">
  <link rel="stylesheet" href="../shared/common.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- Header -->
  <div class="popup-header">
    <h1><i class="fa-solid fa-bookmark"></i> Bookmark Manager</h1>
    <div class="header-actions">
      <button id="btnLogout" class="btn-icon hidden" title="Đăng xuất">
        <i class="fa-solid fa-right-from-bracket"></i>
      </button>
      <button id="btnOpenPanel" class="btn-icon" title="Open Side Panel">
        <i class="fa-solid fa-up-right-and-down-left-from-center"></i>
      </button>
    </div>
  </div>

  <!-- Auth Section (hiển thị khi CHƯA đăng nhập) -->
  <div id="authSection" class="auth-section hidden">
    <p class="auth-intro">Đăng nhập để đồng bộ bookmark của bạn.</p>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="authEmail" placeholder="you@example.com" autocomplete="username">
    </div>
    <div class="form-group">
      <label>Mật khẩu</label>
      <input type="password" id="authPassword" placeholder="••••••••" autocomplete="current-password">
    </div>
    <div id="authError" class="auth-error hidden"></div>
    <button id="btnLogin" class="btn-primary auth-btn">Đăng nhập</button>
    <p class="auth-hint">
      Chưa có tài khoản?
      <a href="#" id="linkRegister">Đăng ký trong Side Panel</a>
    </p>
  </div>

  <!-- Main Content (hiển thị khi ĐÃ đăng nhập) -->
  <div id="mainContent" class="hidden">
    <!-- Account chip -->
    <div id="accountChip" class="account-chip">
      <i class="fa-solid fa-circle-user"></i>
      <span id="accountEmail"></span>
    </div>

    <!-- Current Page Info -->
    <div id="currentPage" class="current-page">
      <img id="pageFavicon" class="page-favicon" src="" alt="">
      <div class="page-info">
        <div id="pageTitle" class="page-title"></div>
        <div id="pageUrl" class="page-url"></div>
      </div>
    </div>

    <!-- Quick Add Button -->
    <button id="btnQuickAdd" class="btn-primary quick-add-btn">
      <i class="fa-solid fa-plus"></i> Add this page to bookmarks
    </button>

    <!-- Search -->
    <div class="search-box">
      <i class="fa-solid fa-search search-icon"></i>
      <input type="text" id="searchInput" placeholder="Search bookmarks...">
    </div>

    <!-- Category List -->
    <div id="categoryList" class="category-list"></div>

    <!-- Search Results -->
    <div id="searchResults" class="search-results hidden"></div>
  </div>

  <!-- Quick Add Modal -->
  <div id="quickAddModal" class="modal-overlay hidden">
    <div class="modal">
      <h3>Add Bookmark</h3>
      <div class="form-group">
        <label>Title</label>
        <input type="text" id="addTitle">
      </div>
      <div class="form-group">
        <label>URL</label>
        <input type="text" id="addUrl" readonly>
      </div>
      <div class="form-group">
        <label>Category</label>
        <select id="addCategory"></select>
      </div>
      <div class="modal-actions">
        <button id="btnCancelAdd" class="btn-secondary">Cancel</button>
        <button id="btnConfirmAdd" class="btn-primary">Save</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast hidden"></div>

  <script type="module" src="popup.js"></script>
</body>
</html>
